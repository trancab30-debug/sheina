
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheina | Photography Portfolio</title>

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #080808;
            color: white;
        }

        /* NAVIGATION BAR */
        .navbar {
            width: 100%;
            height: 76px;
            background-color: #080808;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            position: relative;
            z-index: 10;
        }

        /* LOGO / PHOTOGRAPHER NAME */
        .logo {
            font-size: 20px;
            font-weight: 400;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        /* NAVIGATION LINKS */
        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: #eeeeee;
            text-decoration: none;
            font-size: 11px;
            font-weight: 400;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #999999;
        }

        .share {
            font-style: italic;
            color: #aaaaaa !important;
        }

        /* HERO / MAIN IMAGE */
        .hero {
            width: 100%;
            height: calc(100vh - 76px);
            min-height: 500px;
            overflow: hidden;
            position: relative;
            background-color: #333333;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            /* Original image colors */
        }

        /* RESPONSIVE DESIGN */
        @media screen and (max-width: 1000px) {
            .navbar {
                padding: 0 20px;
            }

            .nav-links {
                gap: 12px;
            }

            .nav-links a {
                font-size: 10px;
            }
        }

        @media screen and (max-width: 750px) {
            .navbar {
                height: auto;
                min-height: 76px;
                flex-direction: column;
                align-items: flex-start;
                justify-content: center;
                gap: 15px;
                padding: 18px 20px;
            }

            .nav-links {
                flex-wrap: wrap;
                gap: 12px 16px;
            }

            .nav-links a {
                font-size: 11px;
            }

            .hero {
                height: calc(100vh - 120px);
                min-height: 400px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVIGATION BAR -->
    <header class="navbar">

        <div class="logo">
            Sheina Ragasa
        </div>

        <nav class="nav-links">
            <a href="#home">Home</a>
            <a href="#portraits">Portraits</a>
            <a href="#fashion">Fashion</a>
            <a href="#commercial">Commercial</a>
            <a href="#events">Events</a>
            <a href="#beauty">Beauty</a>
            <a href="#exhibitions">Exhibitions</a>
            <a href="#info">Info</a>
            <a href="#contact">Contact</a>
            <a href="#instagram" aria-label="Instagram">&#9675;</a>
            <a href="#share" class="share">Share</a>
        </nav>

    </header>

    <!-- MAIN PHOTOGRAPH -->
    <main>
        <section class="hero" id="home">
            <img src="img\photo1.png" alt="GTA V FiveM">
        </section>
    </main>

</body>
</html>
